<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExcretionQuest — Bubble's Clean-Up Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--sky:#e6f4ff;--blue:#3a8dde;--deep:#1f4e79;--pink:#ff7aa8;--ok:#2fb36d;--bad:#e5484d;--ink:#1d2b3a;--muted:#5d7189;--line:#cfe6fb}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#d6edff 0%,#f3faff 55%,#eaf6ff 100%);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20;border-bottom:2px solid var(--line)}
.brand{font-weight:900;color:var(--deep);font-size:1.15rem;cursor:pointer;white-space:nowrap}
.brand span{color:var(--pink)}
.hud{display:flex;gap:8px;align-items:center}
.pill{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;white-space:nowrap}
.iconbtn{font:inherit;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-size:1rem;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:22px;box-shadow:0 6px 0 var(--line),0 12px 30px rgba(58,141,222,.12);padding:20px;margin-bottom:18px}
h1,h2,h3{margin:.2em 0 .45em;line-height:1.2}
h1{color:var(--deep);font-weight:900}
h2{color:var(--deep);font-weight:900}
p{line-height:1.55}
.muted{color:var(--muted)}
.btn{font:inherit;font-weight:800;border:none;border-radius:14px;padding:12px 18px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 4px 0 #2766a8;transition:transform .08s;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2766a8}
.btn.pink{background:var(--pink);box-shadow:0 4px 0 #d24f80}
.btn.green{background:var(--ok);box-shadow:0 4px 0 #1f8a51}
.btn.ghost{background:#fff;color:var(--deep);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.small{padding:7px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.guide{display:flex;gap:12px;align-items:flex-end;margin:6px 0 14px}
.guide .dog{flex:0 0 auto;animation:bob 2.6s ease-in-out infinite}
.speech{position:relative;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:700;flex:1;line-height:1.45}
.speech:before{content:"";position:absolute;left:-17px;bottom:20px;border:8px solid transparent;border-right-color:var(--line)}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
input[type=text]{font:inherit;font-size:1.1rem;padding:12px 14px;border:3px solid var(--line);border-radius:14px;width:min(320px,100%);outline:none}
input[type=text]:focus{border-color:var(--blue)}
/* title */
.hero{text-align:center;padding:26px 20px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);margin:.1em 0}
.hero .sub{font-size:1.15rem;color:var(--muted);font-weight:700}
.organs-strip{font-size:2.4rem;letter-spacing:10px;margin:8px 0}
/* map */
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:640px){.map{grid-template-columns:1fr}}
.zone{cursor:pointer;border-radius:22px;padding:18px 18px 16px;color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .15s;border:none;text-align:left;font:inherit}
.zone:hover{transform:translateY(-3px) rotate(-.4deg)}
.zone .em{font-size:3rem;line-height:1}
.zone h3{font-size:1.4rem;margin:.3em 0 .1em;color:#fff}
.zone .ex{font-weight:700;opacity:.95}
.zone .stars{position:absolute;top:14px;right:16px;font-size:1.3rem;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 10px}
.zone .badge{position:absolute;bottom:12px;right:14px;background:#fff;color:var(--deep);font-weight:900;border-radius:999px;padding:3px 10px;font-size:.85rem}
.z-lungs{background:linear-gradient(135deg,#ff8fab,#ff5c8a)}
.z-skin{background:linear-gradient(135deg,#f6b26b,#e8894a)}
.z-kidneys{background:linear-gradient(135deg,#d9605a,#a63f3a)}
.z-liver{background:linear-gradient(135deg,#8e5ac8,#5b3a96)}
.boss{background:linear-gradient(135deg,#3a8dde,#1f4e79);color:#fff;border-radius:22px;padding:20px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.15);display:flex;align-items:center;gap:16px;border:none;width:100%;text-align:left;font:inherit;margin-top:16px}
.boss .em{font-size:3rem}
.boss h3{color:#fff;font-size:1.4rem;margin:0}
/* organ page */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.tab{font:inherit;font-weight:800;border:3px solid var(--line);background:#fff;color:var(--deep);border-radius:14px;padding:9px 14px;cursor:pointer}
.tab.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
@media(max-width:720px){.facts{grid-template-columns:1fr}}
.fact{background:var(--sky);border-radius:16px;padding:12px 14px}
.fact .fh{display:block;color:var(--deep);margin-bottom:4px;font-weight:900}
.fact ol,.fact ul{margin:4px 0 0;padding-left:20px}
.fact li{margin:2px 0}
.learn{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
@media(max-width:760px){.learn{grid-template-columns:1fr}}
.dia-wrap{background:linear-gradient(180deg,#f7fbff,#eef7ff);border:3px solid var(--line);border-radius:18px;padding:8px}
.dia-wrap svg{width:100%;height:auto;display:block}
.part{cursor:pointer;transition:filter .2s}
.part:hover{filter:brightness(1.12)}
.part.active{filter:drop-shadow(0 0 3px #ff2d7a) drop-shadow(0 0 7px #ff2d7a);animation:glow 1.2s ease-in-out infinite}
.part.right{filter:drop-shadow(0 0 4px #2fb36d) drop-shadow(0 0 9px #2fb36d)}
.part.wrong{filter:drop-shadow(0 0 4px #e5484d) drop-shadow(0 0 9px #e5484d)}
@keyframes glow{50%{filter:drop-shadow(0 0 1px #ff2d7a) drop-shadow(0 0 4px #ff2d7a)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{font:inherit;font-weight:800;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--deep)}
.chip.seen{background:#e7f8ee;border-color:#9fdcb9}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.info{background:#fffaf0;border:3px dashed #ffd59a;border-radius:16px;padding:14px;min-height:120px}
.info h3{color:#b5651d}
.viewsw{display:flex;gap:8px;margin-bottom:8px}
.progress{height:12px;background:#e3f0fb;border-radius:999px;overflow:hidden;margin:8px 0}
.progress > div{height:100%;background:linear-gradient(90deg,#57c785,#2fb36d);width:0;transition:width .3s}
/* quiz */
.qtext{font-size:1.25rem}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{font:inherit;font-weight:700;text-align:left;border:3px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;font-size:1.02rem}
.opt:hover:not(:disabled){border-color:var(--blue);background:#f3f9ff}
.opt.right{background:#e7f8ee;border-color:var(--ok)}
.opt.wrong{background:#fdecec;border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:12px 14px;margin:10px 0;font-weight:600;line-height:1.5}
.fb.ok{background:#e7f8ee;border:2px solid #9fdcb9}
.fb.no{background:#fdecec;border:2px solid #f3b1b3}
.tbar{height:12px;background:#e3f0fb;border-radius:999px;overflow:hidden;margin:6px 0 10px}
.tbar > div{height:100%;width:100%;background:linear-gradient(90deg,#ffb547,#ff5c5c)}
.qhead{display:flex;gap:8px;flex-wrap:wrap}
/* lungs game */
.arena{position:relative;height:380px;border-radius:22px;overflow:hidden;border:3px solid #f3b6c6;background:radial-gradient(circle at 50% 120%,#ffd6e0 0%,#ffe9ef 50%,#fff5f8 100%);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.arena .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:800;color:#c0466b;text-align:center;padding:20px}
.cap{position:absolute;left:0;right:0;bottom:0;height:26px;background:repeating-linear-gradient(90deg,#e63946 0 40px,#3a6fd8 40px 80px);opacity:.35}
.mol{position:absolute;bottom:-70px;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:1.05rem;cursor:pointer;animation:rise linear forwards;box-shadow:inset -6px -6px 0 rgba(0,0,0,.12),0 3px 6px rgba(0,0,0,.15);touch-action:manipulation}
.mol.co2{background:#7b8794}
.mol.h2o{background:#4aa3df}
.mol.o2{background:#ef5b5b}
.mol.pop{animation:pop .3s forwards!important}
@keyframes rise{to{transform:translateY(-470px)}}
@keyframes pop{to{transform:scale(1.8);opacity:0}}
.floaty{position:absolute;font-weight:900;pointer-events:none;animation:floatup .8s forwards;font-size:1.2rem}
@keyframes floatup{to{transform:translateY(-40px);opacity:0}}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 10px;font-weight:700}
.legend i{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;margin-right:4px}
/* kidney sort */
.sortcard{text-align:center;background:var(--sky);border-radius:20px;padding:18px;margin:6px 0 12px;animation:popin .3s}
.sortcard .big{font-size:3.4rem}
@keyframes popin{from{transform:scale(.8);opacity:0}}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.bins{grid-template-columns:1fr}}
.bin{font:inherit;font-weight:800;border:3px solid var(--line);background:#fff;border-radius:16px;padding:14px 10px;cursor:pointer;font-size:1rem}
.bin:hover:not(:disabled){border-color:var(--blue)}
.bin.right{background:#e7f8ee;border-color:var(--ok)}
.bin.wrong{background:#fdecec;border-color:var(--bad)}
.seqbuilt{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;background:var(--sky);border-radius:16px;padding:10px;margin:10px 0;align-items:center}
.seqbuilt .step{background:var(--ok);color:#fff;font-weight:800;border-radius:12px;padding:8px 12px}
.seqbuilt .arrow{font-weight:900;color:var(--deep)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:0 auto}
@media(max-width:600px){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{font:inherit;aspect-ratio:1/1;border-radius:16px;border:none;cursor:pointer;font-weight:800;font-size:.86rem;padding:8px;line-height:1.25;color:#fff;background:linear-gradient(135deg,#8e5ac8,#5b3a96);box-shadow:0 4px 0 #3e2770;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .2s}
.mcard .back{font-size:2rem}
.mcard.up.term{background:#fff;color:var(--deep);border:3px solid #8e5ac8;box-shadow:0 4px 0 #c9b3ea}
.mcard.up.meaning{background:#fff8e6;color:#7a4b00;border:3px solid #f0b33c;box-shadow:0 4px 0 #f3d79a}
.mcard.done{background:#e7f8ee!important;border:3px solid var(--ok)!important;color:#1b6b40!important;box-shadow:0 4px 0 #9fdcb9!important;cursor:default}
/* hotspot */
.prompt{font-size:1.2rem;font-weight:900;background:#fff3d6;border:3px solid #ffd27a;border-radius:16px;padding:12px 14px;margin:6px 0 10px;color:#7a4b00}
/* cert */
.cert{border:10px double #3a8dde;border-radius:20px;padding:28px;text-align:center;background:linear-gradient(180deg,#fff,#f3faff)}
.cert h1{font-size:2rem}
.cert .nm{font-size:2rem;font-weight:900;color:var(--pink);border-bottom:3px dotted var(--line);display:inline-block;padding:0 20px 4px;margin:6px 0}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.result-big{font-size:3rem;text-align:center;margin:6px 0}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:10px 0 24px}
@media print{header,footer,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<header>
  <div class="brand" id="brand">🐾 Excretion<span>Quest</span></div>
  <div class="hud">
    <button class="iconbtn" id="lang" title="Language / Bahasa">🇮🇩 ID</button>
    <span class="pill" id="xp">⭐ 0 XP</span>
    <button class="iconbtn" id="snd" title="Sound on/off">🔊</button>
  </div>
</header>
<main id="app"></main>
<footer id="foot"></footer>

<script>
/* ===================== Helpers ===================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let timers = [];
function clearTimers(){ timers.forEach(t=>{clearInterval(t);clearTimeout(t);}); timers=[]; }

const KEY = 'excretionquest_v1';
function blank(){ return {name:'', sound:true, lang:'en', showdown:0, organs:{lungs:{},skin:{},kidneys:{},liver:{}}}; }
let S = (()=>{ try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d && d.organs) return d; }catch(e){} return blank(); })();
if(!S.lang) S.lang='en';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} updateHud(); }
const T = () => TXT[S.lang];

function xp(){
  let t = S.showdown||0;
  for(const k in S.organs){ const o=S.organs[k]; t += (o.learn?50:0) + (o.gameBest||0) + (o.quizBest||0)*20; }
  return t;
}
function starsOf(id){ const o=S.organs[id]; return (o.learn?1:0)+(o.gamePass?1:0)+((o.quizBest||0)>=4?1:0); }
function updateHud(){
  $('#xp').textContent = '⭐ '+xp()+' XP';
  $('#snd').textContent = S.sound?'🔊':'🔇';
  $('#lang').textContent = S.lang==='en' ? '🇮🇩 Bahasa' : '🇬🇧 English';
  $('#foot').textContent = T().ui.footer;
  document.documentElement.lang = S.lang;
}

/* sound */
let AC=null;
function tone(f, d=0.12, type='sine', delay=0, vol=0.15){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+delay;
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
const sfx = {
  good(){ tone(660,.1,'triangle'); tone(880,.14,'triangle',.09); },
  bad(){ tone(200,.22,'sawtooth',0,.08); },
  pop(){ tone(520+Math.random()*200,.07,'square',0,.06); },
  win(){ [523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',i*.12)); },
  click(){ tone(440,.05,'sine',0,.06); }
};
function confetti(n=80){
  const cols=['#ff7aa8','#3a8dde','#ffd166','#2fb36d','#8e5ac8','#f6b26b'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=pick(cols);
    c.style.animationDuration=(1.8+Math.random()*1.8)+'s'; c.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),4200);
  }
}

/* ===================== Bubble the Maltese (drawn from her photo) ===================== */
function dog(size=96, mood='happy'){
  const E='#c9d5e3', SH='#e3eaf2';
  const eyes = mood==='wow'
    ? '<ellipse cx="56" cy="60" rx="6" ry="6.4" fill="#231d18"/><ellipse cx="84" cy="60" rx="6" ry="6.4" fill="#231d18"/><circle cx="58.2" cy="57.4" r="2.4" fill="#fff"/><circle cx="86.2" cy="57.4" r="2.4" fill="#fff"/><circle cx="54.4" cy="62.6" r="1.1" fill="#fff"/><circle cx="82.4" cy="62.6" r="1.1" fill="#fff"/>'
    : mood==='sad'
    ? '<ellipse cx="56" cy="61" rx="5" ry="4.6" fill="#231d18"/><ellipse cx="84" cy="61" rx="5" ry="4.6" fill="#231d18"/><circle cx="57.6" cy="59.5" r="1.6" fill="#fff"/><circle cx="85.6" cy="59.5" r="1.6" fill="#fff"/><path d="M49 53 Q55 51 61 54 M79 54 Q85 51 91 53" stroke="#b9c6d6" stroke-width="2" fill="none" stroke-linecap="round"/>'
    : '<ellipse cx="56" cy="60" rx="5.2" ry="5.5" fill="#231d18"/><ellipse cx="84" cy="60" rx="5.2" ry="5.5" fill="#231d18"/><circle cx="57.8" cy="58" r="1.9" fill="#fff"/><circle cx="85.8" cy="58" r="1.9" fill="#fff"/>';
  const mouth = mood==='sad'
    ? '<path d="M64 85 Q70 81.5 76 85" stroke="#3a2f29" stroke-width="2.2" fill="none" stroke-linecap="round"/>'
    : '<path d="M63 82 Q70 86.5 77 82" stroke="#3a2f29" stroke-width="2.2" fill="none" stroke-linecap="round"/>' + (mood==='wow'?'<path d="M66.5 84.5 Q70 95 73.5 84.5Z" fill="#ff9fb5" stroke="#e87e98" stroke-width=".8"/>':'');
  const tips = (x0,dir)=>{ let d=''; for(let i=0;i<5;i++){ const x=x0+dir*i*7; d+=`M${x} ${120+(i%2)*4} q${dir*3} 8 ${dir*1} 14 `; } return d; };
  return `<svg class="dogsvg" width="${size}" height="${size}" viewBox="0 0 140 140" role="img" aria-label="Bubble the Maltese">
  <defs>
   <linearGradient id="bhair" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf2f8"/></linearGradient>
   <radialGradient id="bface" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#fbf4ea"/></radialGradient>
  </defs>
  <!-- long coat flowing down, wispy ends -->
  <path d="M70 18 C46 18 34 34 32 54 C30 72 22 88 14 102 C8 112 4 122 3 132 Q11 126 15 135 Q22 128 28 136 Q35 129 42 136 L98 136 Q105 129 112 136 Q118 128 125 135 Q129 126 137 132 C136 122 132 112 126 102 C118 88 110 72 108 54 C106 34 94 18 70 18Z" fill="url(#bhair)" stroke="${E}" stroke-width="2"/>
  <path d="M22 98 C18 110 14 120 12 130 M30 100 C27 112 25 122 24 132 M118 98 C122 110 126 120 128 130 M110 100 C113 112 115 122 116 132" stroke="${SH}" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- chest -->
  <path d="M46 96 C50 112 58 122 70 124 C82 122 90 112 94 96 Z" fill="#ffffff"/>
  <path d="M58 104 C60 112 62 118 64 124 M82 104 C80 112 78 118 76 124 M70 106 L70 124" stroke="${SH}" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- front paws (lying down) -->
  <ellipse cx="50" cy="128" rx="13" ry="8" fill="#fff" stroke="${E}" stroke-width="1.8"/><ellipse cx="90" cy="128" rx="13" ry="8" fill="#fff" stroke="${E}" stroke-width="1.8"/>
  <path d="M45 133 l0 -3.5 M50 134 l0 -3.5 M55 133 l0 -3.5 M85 133 l0 -3.5 M90 134 l0 -3.5 M95 133 l0 -3.5" stroke="#efc3ad" stroke-width="1.8" stroke-linecap="round"/>
  <!-- collar + bone tag -->
  <path d="M50 97 Q70 106 90 97" stroke="#ff8a3d" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <g transform="translate(70 109) rotate(-8)"><circle cx="-7" cy="-3.2" r="3.4" fill="#a9cdea"/><circle cx="-7" cy="3.2" r="3.4" fill="#a9cdea"/><circle cx="7" cy="-3.2" r="3.4" fill="#a9cdea"/><circle cx="7" cy="3.2" r="3.4" fill="#a9cdea"/><rect x="-7" y="-3.3" width="14" height="6.6" fill="#a9cdea"/><rect x="-4" y="-1.2" width="8" height="2.4" rx="1.2" fill="#ff8a3d"/></g>
  <!-- face -->
  <ellipse cx="70" cy="68" rx="25" ry="24" fill="url(#bface)"/>
  <ellipse cx="55" cy="68" rx="4.5" ry="2.6" fill="#f2d4bb" opacity=".85"/><ellipse cx="85" cy="68" rx="4.5" ry="2.6" fill="#f2d4bb" opacity=".85"/>
  ${eyes}
  <!-- moustache: long white locks fanning down from the muzzle -->
  <path d="M68 74 C58 75 48 82 40 98 C50 92 56 90 63 88 C60 93 58 97 57 103 C62 96 66 91 69 86Z" fill="#fff" stroke="${E}" stroke-width="1.4" stroke-linejoin="round"/>

   where:"In the chest (thoracic) cavity, protected by the ribs and wrapped in a thin membrane called the <b>pleura</b>.",
   wasteL:"<b>Carbon dioxide (CO₂)</b> and <b>water vapour (H₂O)</b> — made by your cells during respiration.",
   how:["Cells: glucose + O₂ → CO₂ + H₂O + energy","Blood carries CO₂ to the lungs","CO₂ diffuses from capillaries into the alveoli","You breathe it out! 💨"],
   views:[{name:'Lungs', parts:{
    trachea:["Trachea (windpipe)","A tube kept open by C-shaped rings of cartilage. Air full of CO₂ and water vapour leaves your body through here when you breathe out."],
    bronchi:["Bronchi","The trachea splits into two bronchi — one going into each lung."],
    bronchioles:["Bronchioles","Thinner and thinner branching tubes, like an upside-down tree, that carry air to the alveoli."],
    alveoli:["Alveoli","Hundreds of millions of tiny air sacs, each wrapped in capillaries. Here CO₂ <b>diffuses</b> out of the blood into the air (high → low concentration), while O₂ diffuses in."],
    rightlung:["Right lung","Has <b>3 lobes</b>. It's on YOUR left in the picture because we're looking at the body from the front!"],
    leftlung:["Left lung","Has only <b>2 lobes</b> and is a little smaller, leaving a notch to make room for the heart. ❤️"],
    diaphragm:["Diaphragm","A dome-shaped muscle under the lungs. When it relaxes and moves up, the chest gets smaller and CO₂-rich air is pushed out (exhalation)."]
   }}]},
  skin:{ name:'Skin', waste:'Sweat',
   hello:"This is the Skin — your body's BIGGEST organ! It excretes sweat and keeps you cool. Tap every part! 💦",
   where:"Covers your whole body — about <b>2 m²</b> in an adult. It's the <b>largest organ</b> of the human body.",
   wasteL:"<b>Sweat</b> — mostly water, plus salts (NaCl) and a little <b>urea</b>.",
   how:["Body gets hot 🔥","The hypothalamus (in the brain) sends a signal","Sweat glands take water, salt & urea from the blood","Sweat leaves through pores and evaporates → you cool down ❄️"],
   views:[{name:'Skin', parts:{
    epidermis:["Epidermis","The thin outer layer. Its top (stratum corneum) is dead cells that keep flaking off. Its base (stratum germinativum) makes new cells and the pigment <b>melanin</b>."],
    dermis:["Dermis","The thick middle layer — home to sweat glands, oil glands, hair roots, blood vessels and nerves."],
    hypo:["Hypodermis (fat layer)","Fatty tissue under the dermis. It stores energy, cushions your body and keeps you warm."],
    sweat:["Sweat gland","A coiled tube in the dermis that collects water, salts and a little urea from the blood to make <b>sweat</b>."],
    pore:["Pore","The tiny opening where sweat leaves the skin. As sweat evaporates, it takes heat away with it."],
    oil:["Sebaceous (oil) gland","Makes <b>sebum</b>, an oil that keeps hair and skin soft and waterproof. Blocked oil glands can cause acne!"],
    hair:["Hair & follicle","Hair grows from the follicle. Tiny muscles pull hairs upright when you're cold — goosebumps!"],
    vessels:["Blood vessels","When you're hot they widen (vasodilation) so more heat escapes through the skin. When you're cold they narrow."],
    nerve:["Nerve endings","Sense touch, pressure, pain, heat and cold — and report to the brain."]
   }}]},
  kidneys:{ name:'Kidneys', waste:'Urine',
   hello:"The Kidneys are your body's water-cleaning factory! Explore the kidney, then switch to the Nephron view. 🫘",
   where:"A pair of bean-shaped organs at the back of the abdomen, on each side of the spine — each about the size of your fist.",
   wasteL:"<b>Urine</b> — water, <b>urea</b>, uric acid, salts and ammonia.",
   how:["<b>Filtration</b> in the glomerulus → primary urine","<b>Reabsorption</b> in the proximal tubule → secondary urine","<b>Augmentation</b> in the distal tubule → real urine","Kidney → ureter → bladder → urethra 🚽"],
   views:[
    {name:'Kidney', parts:{
     cortex:["Cortex","The outer layer. It holds the glomeruli and Bowman's capsules — where blood filtering begins."],
     medulla:["Medulla (renal pyramids)","The inner part, made of cone-shaped pyramids packed with tubules (loops of Henle and collecting ducts)."],
     pelvis:["Renal pelvis","A funnel-shaped space that collects urine from the collecting ducts and passes it into the ureter."],
     ureter:["Ureter","A tube that carries urine down to the urinary bladder. The journey: kidney → ureter → bladder → urethra → out!"],
     artery:["Renal artery","Brings 'dirty' blood, full of wastes like urea, into the kidney."],
     vein:["Renal vein","Carries cleaned blood out of the kidney and back toward the heart."]
    }},
    {name:'Nephron', parts:{
     glomerulus:["Glomerulus","A knot of tiny capillaries. Blood pressure pushes water, glucose, salts, amino acids and urea out: <b>1️⃣ FILTRATION</b>. Blood cells and proteins are too big and stay in the blood. The liquid made is <b>primary urine</b>."],
     capsule:["Bowman's capsule","A cup wrapped around the glomerulus that catches the filtrate (primary urine)."],
     pct:["Proximal tubule","<b>2️⃣ REABSORPTION</b>: useful things — glucose, amino acids, most of the water and some salts — are taken back into the blood. What's left is <b>secondary urine</b>, rich in urea."],
     loop:["Loop of Henle","A U-shaped tube that dips into the medulla and helps reabsorb more water, so urine gets concentrated."],
     dct:["Distal tubule","<b>3️⃣ AUGMENTATION</b>: extra wastes (like H⁺ ions, ammonia and more urea) are added. Now it's real urine!"],
     duct:["Collecting duct","Collects urine from many nephrons and carries it to the renal pelvis."]
    }}]},
  liver:{ name:'Liver', waste:'Bile (+ makes urea)',
   hello:"Meet the Liver — the body's chemical factory and the largest INTERNAL organ. Tap each part! 🧪",
   where:"Upper right of the abdomen, just under the diaphragm. It's the <b>largest internal organ</b> (about 1.5 kg).",
   wasteL:"<b>Bile</b>, containing bile pigments (<b>bilirubin</b> & <b>biliverdin</b>). It also turns toxic ammonia into <b>urea</b>.",
   how:["Old red blood cells (≈120 days old) are broken down","Hemoglobin → bile pigments → bile","Bile goes to the intestine and makes feces brown","Ammonia → urea → blood → kidneys → urine"],
   views:[{name:'Liver', parts:{
    rightlobe:["Right lobe","The biggest part of the liver. Liver cells here break down hemoglobin from old red blood cells and convert ammonia into urea."],
    leftlobe:["Left lobe","Smaller, stretching toward the stomach. Same hard-working liver cells! The liver also stores glucose as <b>glycogen</b> and removes toxins."],
    gallbladder:["Gallbladder","A small green pouch under the liver that stores and concentrates bile until you eat fatty food."],
    bileduct:["Bile duct","Carries bile from the liver and gallbladder into the small intestine (duodenum), where it breaks fat into tiny droplets (emulsification)."],
    portal:["Hepatic portal vein","Brings blood from the intestines — full of nutrients (and sometimes toxins) — to the liver to be processed."]
   }}]}
 },
 quiz:{
  lungs:[
   {q:"Which wastes are excreted by the lungs?",o:["Carbon dioxide and water vapour","Oxygen and nitrogen","Urea and salt","Bile pigments"],why:"CO₂ and H₂O are by-products of cellular respiration: glucose + O₂ → CO₂ + H₂O + energy."},
   {q:"Where in the lungs does gas exchange happen?",o:["Alveoli","Trachea","Bronchi","Diaphragm"],why:"The alveoli are tiny air sacs with very thin walls, wrapped in capillaries — perfect for diffusion."},
   {q:"How many lobes does the RIGHT lung have?",o:["3","2","1","4"],why:"Right lung = 3 lobes, left lung = 2 lobes (it leaves room for the heart)."},
   {q:"You blow through a straw into limewater and it turns cloudy. Which gas does this prove you breathe out?",o:["Carbon dioxide","Oxygen","Nitrogen","Hydrogen"],why:"CO₂ reacts with limewater (calcium hydroxide) to form calcium carbonate, which makes it milky."},
   {q:"How does CO₂ move from the blood into the alveoli?",o:["By diffusion, from high to low concentration","It is pumped by the stomach","By osmosis of water","It is carried by bile"],why:"There is more CO₂ in the blood than in the alveoli, so it diffuses into the air sacs."}
  ],
  skin:[
   {q:"What is the main excretory product of the skin?",o:["Sweat","Urine","Bile","Oxygen"],why:"Sweat glands in the skin excrete sweat."},
   {q:"Sweat is mainly made of…",o:["Water, salts and a little urea","Blood and protein","Glucose and fat","Bile pigments"],why:"Sweat is about 99% water, plus salts like NaCl and small amounts of urea."},
   {q:"In which skin layer are the sweat glands found?",o:["Dermis","Epidermis","Hair shaft","Stratum corneum"],why:"Sweat glands are coiled in the dermis, with a duct that leads up to a pore."},
   {q:"Why do we sweat more on a hot day?",o:["Evaporating sweat cools the body","To make the skin shiny","To excrete extra oxygen","To grow more hair"],why:"Evaporation takes heat away from the skin, keeping body temperature around 37 °C."},
   {q:"The outer part of the epidermis, made of dead cells, is called the…",o:["Stratum corneum","Stratum germinativum","Hypodermis","Sebaceous gland"],why:"The stratum corneum (horny layer) is dead cells that protect you and keep flaking off."}
  ],
  kidneys:[
   {q:"What are the tiny filtering units of the kidney called?",o:["Nephrons","Alveoli","Neurons","Villi"],why:"Each kidney has about one million nephrons!"},
   {q:"What is the FIRST stage of urine formation, which happens in the glomerulus?",o:["Filtration","Reabsorption","Augmentation","Digestion"],why:"Filtration happens first, producing primary urine (filtrate)."},
   {q:"Which substance should NOT be in the urine of a healthy person?",o:["Glucose","Water","Urea","Salt"],why:"Glucose is completely reabsorbed. Glucose in urine (glucosuria) can be a sign of diabetes mellitus."},
   {q:"What is the correct path of urine leaving the body?",o:["Kidney → ureter → bladder → urethra","Kidney → urethra → bladder → ureter","Bladder → kidney → ureter → urethra","Ureter → kidney → urethra → bladder"],why:"Ureters carry urine to the bladder; the urethra carries it out of the body."},
   {q:"What gives urine its yellow colour?",o:["Urochrome, from broken-down bile pigments","Glucose","Red blood cells","Chlorophyll"],why:"Urochrome comes from the breakdown of bile pigments — a link between the liver and kidneys!"}
  ],
  liver:[
   {q:"Which substance does the liver excrete?",o:["Bile","Sweat","Urine","Carbon dioxide"],why:"The liver makes bile, which carries bile pigments out of the body through the intestines."},
   {q:"Bile pigments (bilirubin and biliverdin) come from…",o:["The hemoglobin of old red blood cells","Digested fat","The air we breathe","Our bones"],why:"Red blood cells live about 120 days. Then their hemoglobin is broken down into bile pigments."},
   {q:"The liver turns toxic ammonia into…",o:["Urea","Glucose","Oxygen","Bile salts"],why:"Ammonia comes from breaking down amino acids. Urea is much less toxic and is removed by the kidneys."},
   {q:"Where is bile stored?",o:["Gallbladder","Urinary bladder","Stomach","Pancreas"],why:"The gallbladder stores bile and releases it into the duodenum when you eat fatty food."},
   {q:"If the liver can't process bilirubin well, the skin and eyes turn yellow. This is called…",o:["Jaundice","Acne","Asthma","Kidney stones"],why:"Jaundice happens when bilirubin builds up in the blood — often a sign of liver trouble like hepatitis."}
  ]
 },
 extra:[
  {q:"What is the LARGEST organ of the human body?",o:["Skin","Liver","Lungs","Intestine"],why:"The skin! The liver is the largest INTERNAL organ."},
  {q:"What is the largest INTERNAL organ?",o:["Liver","Kidney","Heart","Stomach"],why:"The liver weighs about 1.5 kg in adults."},
  {q:"About how long does a red blood cell live?",o:["120 days","12 days","2 years","10 years"],why:"After about 120 days, old red blood cells are broken down in the liver and spleen."},
  {q:"Which part of the brain controls body temperature and sweating?",o:["Hypothalamus","Cerebellum","Medulla oblongata","Cerebrum"],why:"The hypothalamus works like the body's thermostat."},
  {q:"Which of these is NOT an excretory organ?",o:["Stomach","Skin","Liver","Lungs"],why:"The stomach digests food. Getting rid of undigested food (feces) is called egestion, not excretion."},
  {q:"The urea in your urine was first made in the…",o:["Liver","Kidneys","Bladder","Skin"],why:"The liver makes urea; the kidneys just filter it out of the blood. Teamwork!"},
  {q:"How much urine does a healthy adult make per day?",o:["About 1–2 litres","About 50 mL","About 10 litres","About 180 litres"],why:"The kidneys filter ~180 L of fluid a day but reabsorb almost all of it!"},
  {q:"What does 'excretion' mean?",o:["Removing metabolic waste made by body cells","Removing undigested food","Breathing in oxygen","Digesting fat"],why:"Excretion removes waste from metabolism (CO₂, urea, sweat…). Removing undigested food is egestion."},
  {q:"Breathing onto a cold mirror makes it foggy. This shows we breathe out…",o:["Water vapour","Oxygen","Bile","Salt"],why:"The water vapour in your breath condenses into tiny droplets on the cold glass."},
  {q:"Kidney stones are mostly formed from…",o:["Calcium salts","Sugar","Fat","Hair"],why:"Calcium salts (like calcium oxalate) can crystallise, especially if you don't drink enough water."},
  {q:"Why is feces (poop) brown?",o:["Pigments that come from bile","Chlorophyll from vegetables","Red blood cells","Sweat"],why:"Bile pigments are changed by gut bacteria into brown pigments (stercobilin)."},
  {q:"Which organ belongs to BOTH the respiratory system and the excretory system?",o:["Lungs","Kidneys","Liver","Skin"],why:"The lungs breathe in oxygen AND excrete carbon dioxide and water vapour."}
 ],
 fun:[
  "Your kidneys filter about 180 litres of fluid every day — but you only pee about 1.5 litres of it! 🫘",
  "Fresh sweat has almost no smell. The smell comes from bacteria on your skin! 🦠",
  "Your liver can regrow itself, even if part of it is removed! 🟤",
  "A red blood cell lives about 120 days before it's recycled. ♻️",
  "Spread out flat, your alveoli would cover roughly the floor of a classroom! 🫁",
  "You have about 2–4 million sweat glands! 💦",
  "Poop is brown because of pigments that come from bile! 💩",
  "Each kidney has about one million nephrons! 🔬",
  "Drinking enough water helps your kidneys and helps prevent kidney stones! 💧",
  "The liver changes toxic ammonia into much safer urea. 🧪",
  "Your skin sheds dead cells all the time — much of household dust is old skin! 🧹"
 ],
 sort:[
  {e:'🔴',n:'Red blood cells',a:0,why:"Too big to pass through the glomerulus filter — they stay in the blood."},
  {e:'🧬',n:'Blood proteins',a:0,why:"Proteins are too large to be filtered. Protein in urine (albuminuria) can be a sign of kidney damage."},
  {e:'🩹',n:'Platelets',a:0,why:"Platelets are cell fragments — too big to be filtered, so they stay in the blood."},
  {e:'🍬',n:'Glucose',a:1,why:"Glucose is filtered, then fully reabsorbed in the proximal tubule. Glucose in urine is a sign of diabetes."},
  {e:'🥚',n:'Amino acids',a:1,why:"Amino acids are useful — they're filtered, then reabsorbed back into the blood."},
  {e:'💧',n:'Most of the water',a:1,why:"About 99% of the filtered water is reabsorbed! Only the extra water leaves in urine."},
  {e:'⚗️',n:'Urea',a:2,why:"Urea is the main waste in urine. It was made by the liver from ammonia."},
  {e:'🧂',n:'Excess salt',a:2,why:"Your body keeps the salt it needs; the extra leaves in urine."},
  {e:'💎',n:'Uric acid',a:2,why:"Uric acid is a waste product — it leaves in urine. Too much can form crystals!"},
  {e:'☣️',n:'Ammonia & H⁺ ions',a:2,why:"These are added to the urine in the distal tubule during augmentation."}
 ],

let resetArmed=false;
function confirmReset(){
  if(resetArmed){ resetArmed=false; return true; }
  resetArmed=true; const b=$('#rst'); b.textContent=T().ui.resetSure; setTimeout(()=>{ resetArmed=false; if(b.isConnected) b.textContent=T().ui.reset; },3000);
  return false;
}

/* ---------- Learn ---------- */
function learnPane(el,id){
  const o=O(id), u=T().ui;
  const views = o.views.map((v,i)=>({...v, svg:META[id].svgs[i](T().svg), key:'v'+i}));
  const allParts = views.flatMap(v=>Object.keys(v.parts).map(p=>v.key+':'+p));
  const seen = new Set();
  let view = 0;
  el.innerHTML = `${guide(o.hello,'happy',80,'lg')}
   <div class="facts">
     <div class="fact"><span class="fh">${u.where}</span>${o.where}</div>
     <div class="fact"><span class="fh">${u.wasteQ}</span>${o.wasteL}</div>
     <div class="fact"><span class="fh">${u.how}</span><ol>${o.how.map(h=>`<li>${h}</li>`).join('')}</ol></div>
   </div>
   <div class="learn">
     <div>
       ${views.length>1?`<div class="viewsw">${views.map((v,i)=>`<button class="tab ${i===0?'on':''}" data-v="${i}">🔍 ${v.name}</button>`).join('')}</div>`:''}
       <div class="dia-wrap" id="dia"></div>
     </div>
     <div>
       <div class="progress"><div id="lp"></div></div>
       <div class="muted" id="lpt" style="font-weight:700"></div>
       <div class="chips" id="chips"></div>
       <div class="info" id="info"><h3>${u.tapT}</h3><p>${u.tapB}</p></div>
     </div>
   </div>`;
  function drawView(){
    const v=views[view];
    $('#dia',el).innerHTML = v.svg;
    $('#chips',el).innerHTML = Object.entries(v.parts).map(([k,p])=>`<button class="chip ${seen.has(v.key+':'+k)?'seen':''}" data-p="${k}">${seen.has(v.key+':'+k)?'✓ ':''}${p[0]}</button>`).join('');
    $$('.part',el).forEach(g=>g.addEventListener('click',()=>select(g.dataset.part)));
    $$('.chip',el).forEach(c=>c.onclick=()=>select(c.dataset.p));
    prog();
  }
  function prog(){
    $('#lp',el).style.width=Math.round(seen.size/allParts.length*100)+'%';
    $('#lpt',el).textContent = u.explored(seen.size, allParts.length);
  }
  function select(k){
    const v=views[view]; const p=v.parts[k]; if(!p) return;
    sfx.click();
    $$('.part',el).forEach(g=>g.classList.toggle('active',g.dataset.part===k));
    const key=v.key+':'+k, isNew=!seen.has(key); seen.add(key);
    $$('.chip',el).forEach(c=>{ const kk=v.key+':'+c.dataset.p; c.classList.toggle('on',c.dataset.p===k); c.classList.toggle('seen',seen.has(kk)); c.textContent=(seen.has(kk)?'✓ ':'')+v.parts[c.dataset.p][0]; });
    $('#info',el).innerHTML = `<h3>${p[0]}</h3><p>${p[1]}</p>`;
    prog();
    if(isNew && seen.size===allParts.length){
      const first = !S.organs[id].learn;
      S.organs[id].learn=true; save(); sfx.win(); if(first) confetti(60);
      $('#lg',el).innerHTML = u.learnDone(o.name);
      $('#lg-dog',el).innerHTML = dog(80,'wow');
      $('#info',el).insertAdjacentHTML('beforeend',`<div class="row" style="margin-top:10px"><button class="btn green" id="toplay">${u.toPlay}</button></div>`);
      $('#toplay',el).onclick=()=>go(screenOrgan,id,'play');
    }
  }
  $$('.viewsw .tab',el).forEach(b=>b.onclick=()=>{ view=+b.dataset.v; $$('.viewsw .tab',el).forEach(x=>x.classList.toggle('on',x===b)); $('#info',el).innerHTML=`<h3>${u.tapT}</h3><p>${u.tapView}</p>`; drawView(); });
  drawView();
}

/* ---------- Generic result ---------- */
function gameResult(el,id,{pass,title,detail,points}){
  const st=S.organs[id], u=T().ui;
  const firstPass = pass && !st.gamePass;
  if(pass) st.gamePass=true;
  st.gameBest = Math.max(st.gameBest||0, points||0);
  save();
  if(pass){ sfx.win(); confetti(firstPass?90:40); } else sfx.bad();
  el.innerHTML = `${guide(pass?`${title} ${firstPass?u.gameStar:''}`:`${title} ${u.tryAgain}`, pass?'wow':'sad',90)}
    <div class="result-big">${pass?'🎉':'💪'}</div>
    <p class="center" style="font-weight:700">${detail}</p>
    <div class="row" style="justify-content:center">
      <button class="btn ghost" id="again">${u.again}</button>
      <button class="btn ${pass?'green':''}" id="toquiz">${u.toQuiz}</button>
    </div>`;
  $('#again',el).onclick=()=>go(screenOrgan,id,'play');
  $('#toquiz',el).onclick=()=>go(screenOrgan,id,'quiz');
}

/* ---------- Lungs game ---------- */
function gameLungs(el,id){
  const u=T().ui;
  el.innerHTML = `${guide(u.lgIntro,'happy',80)}
   <div class="legend"><span><i style="background:#7b8794"></i>${u.lgLeg[0]}</span><span><i style="background:#4aa3df"></i>${u.lgLeg[1]}</span><span><i style="background:#ef5b5b"></i>${u.lgLeg[2]}</span></div>
   <div class="row" style="margin-bottom:10px"><span class="pill">⏱ <b id="lt">30</b>s</span><span class="pill">${u.score} <b id="ls">0</b></span><span class="pill">${u.best} ${S.organs[id].gameBest||0}</span></div>
   <div class="arena" id="arena"><div class="cap"></div><div class="hint" id="hint"><div style="font-size:3rem">🫁</div><div>${u.ready}</div><br><button class="btn pink" id="lgo">${u.startL}</button></div></div>`;
  const arena=$('#arena',el); let score=0, t=30, running=false;
  $('#lgo',el).onclick = ()=>{
    $('#hint',el).remove(); running=true; sfx.click();
    timers.push(setInterval(spawn, 560));
    timers.push(setInterval(()=>{ t--; $('#lt',el).textContent=t; if(t<=0) end(); },1000));
  };
  function floaty(x,y,txt,col){ const f=document.createElement('div'); f.className='floaty'; f.style.left=x+'px'; f.style.top=y+'px'; f.style.color=col; f.textContent=txt; arena.appendChild(f); setTimeout(()=>f.remove(),800); }
  function spawn(){
    if(!running) return;
    const r=Math.random(), type = r<.42?'co2':(r<.72?'h2o':'o2');
    const m=document.createElement('div'); m.className='mol '+type;
    m.textContent = {co2:'CO₂',h2o:'H₂O',o2:'O₂'}[type];
    m.style.left = Math.random()*(arena.clientWidth-70)+'px';
    m.style.animationDuration = (3.2+Math.random()*2.2)+'s';
    m.addEventListener('animationend',()=>{ if(!m.classList.contains('pop')) m.remove(); });
    m.addEventListener('pointerdown',e=>{
      e.preventDefault(); if(!running||m.classList.contains('pop')) return;
      const rect=m.getBoundingClientRect(), ar=arena.getBoundingClientRect(), x=rect.left-ar.left+10, y=rect.top-ar.top;
      if(type==='o2'){ score=Math.max(0,score-15); sfx.bad(); floaty(x,y,u.keepO2,'#e5484d'); arena.classList.add('shake'); setTimeout(()=>arena.classList.remove('shake'),350); }
      else { score+=10; sfx.pop(); floaty(x,y,'+10 💨','#1f8a51'); }
      $('#ls',el).textContent=score;
      m.style.transform = getComputedStyle(m).transform; m.classList.add('pop'); setTimeout(()=>m.remove(),300);
    });
    arena.appendChild(m);
  }
  function end(){
    running=false; clearTimers();
    const pass=score>=120;
    gameResult(el,id,{pass,points:Math.min(score,300),title:pass?u.lgWin(score):u.lgLose(score),detail:u.lgDetail});
  }
}

/* ---------- Skin game ---------- */
function gameSkin(el,id){
  const u=T().ui, P=T().prompts, parts=O('skin').views[0].parts;
  const prompts = shuffle(Object.keys(P));
  let i=0, mistakes=0, lock=false;
  el.innerHTML = `${guide(u.sgIntro,'happy',80,'sg')}
    <div class="prompt" id="sp"></div>
    <div class="row" style="margin-bottom:8px"><span class="pill">${u.part} <b id="si">1</b>/${prompts.length}</span><span class="pill">❌ ${u.mistakes} <b id="sm">0</b></span></div>
    <div class="dia-wrap" style="max-width:620px;margin:0 auto">${SKIN_SVG(T().svg)}</div>`;
  const showP=()=>{ $('#sp',el).textContent=P[prompts[i]]; $('#si',el).textContent=i+1; };
  $$('.part',el).forEach(g=>g.addEventListener('click',()=>{
    if(lock) return;
    const k=g.dataset.part;
    if(k===prompts[i]){
      sfx.good(); g.classList.add('right'); lock=true;
      $('#sg',el).innerHTML = pick(u.sgGood) + ' ' + parts[k][1];
      $('#sg-dog',el).innerHTML=dog(80,'wow');
      timers.push(setTimeout(()=>{ g.classList.remove('right'); lock=false; i++; if(i>=prompts.length) finish(); else showP(); }, 1500));
    } else {
      sfx.bad(); mistakes++; $('#sm',el).textContent=mistakes; g.classList.add('wrong');
      $('#sg',el).innerHTML = u.sgWrong(parts[k][0]);
      $('#sg-dog',el).innerHTML=dog(80,'sad');
      timers.push(setTimeout(()=>g.classList.remove('wrong'),700));
    }
  }));
  function finish(){
    const pass=mistakes<=3;
    gameResult(el,id,{pass,points:Math.max(0,180-mistakes*20),title:pass?u.sgWin(mistakes):u.sgLose(mistakes),detail:u.sgDetail});
  }
  showP();
}

/* ---------- Kidney game ---------- */
function gameKidney(el,id){
  const u=T().ui, items=shuffle(T().sort), BINS=T().bins, SEQS=T().seqs; let i=0, correct=0, seqMistakes=0;
  function showItem(){
    const it=items[i];
    el.innerHTML = `${guide(u.kgIntro,'happy',80,'kg')}
      <div class="row"><span class="pill">${u.item} ${i+1}/${items.length}</span><span class="pill">✅ ${correct}</span></div>
      <div class="sortcard"><div class="big">${it.e}</div><h3>${it.n}</h3><div class="muted">${u.whatHappens}</div></div>
      <div class="bins">${BINS.map((b,k)=>`<button class="bin" data-k="${k}">${b}</button>`).join('')}</div>
      <div id="kfb"></div>`;
    $$('.bin',el).forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, ok=k===it.a;
      $$('.bin',el).forEach(x=>{ x.disabled=true; if(+x.dataset.k===it.a) x.classList.add('right'); });
      if(ok){ correct++; sfx.good(); } else { b.classList.add('wrong'); sfx.bad(); }
      $('#kg-dog',el).innerHTML=dog(80,ok?'wow':'sad');
      $('#kg',el).innerHTML= ok?pick(u.kgGood):u.kgBad;
      $('#kfb',el).innerHTML = `<div class="fb ${ok?'ok':'no'}">${ok?'✅':'❌'} ${it.why}</div><div class="row"><button class="btn" id="knext">${i<items.length-1?u.nextBtn:u.toPuzzle}</button></div>`;
      $('#knext',el).onclick=()=>{ i++; if(i<items.length) showItem(); else seq(0); };
    });
  }
  function seq(s){
    const Q=SEQS[s]; let pos=0;
    el.innerHTML = `${guide(u.puzzle(s+1,Q.title),'happy',80,'kg')}
      <div class="seqbuilt" id="built"><span class="muted">${u.buildHint}</span></div>
      <div class="row" id="opts">${shuffle(Q.items).map(t=>`<button class="btn ghost" data-t="${esc(t)}">${t}</button>`).join('')}</div>`;
    $$('#opts .btn',el).forEach(b=>b.onclick=()=>{
      if(b.dataset.t===Q.items[pos]){
        sfx.good(); const built=$('#built',el); if(pos===0) built.innerHTML='';
        built.insertAdjacentHTML('beforeend',`${pos?'<span class="arrow">→</span>':''}<span class="step">${Q.items[pos]}</span>`);
        b.remove(); pos++;
        if(pos===Q.items.length){ $('#kg',el).innerHTML=u.perfect; $('#kg-dog',el).innerHTML=dog(80,'wow'); timers.push(setTimeout(()=>{ if(s===0) seq(1); else finish(); },1300)); }
      } else { sfx.bad(); seqMistakes++; b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400); $('#kg',el).innerHTML=u.notYet; $('#kg-dog',el).innerHTML=dog(80,'sad'); }
    });
  }
  function finish(){
    const pass=correct>=7;
    gameResult(el,id,{pass,points:correct*15+Math.max(0,50-seqMistakes*10),title:pass?u.kgWin(correct):u.kgLose(correct),detail:u.kgDetail(seqMistakes)});
  }
  showItem();
}

/* ---------- Liver game ---------- */
function gameLiver(el,id){
  const u=T().ui, PAIRS=T().pairs;
  const cards = shuffle(PAIRS.flatMap((p,k)=>[{k,t:p[0],kind:'term'},{k,t:p[1],kind:'meaning'}]));
  let open=[], matched=0, moves=0, lock=false;
  el.innerHTML = `${guide(u.mgIntro,'happy',80,'mg')}
    <div class="row" style="margin-bottom:10px"><span class="pill">${u.moves} <b id="mv">0</b></span><span class="pill">${u.pairs} <b id="pr">0</b>/6</span></div>
    <div class="mem">${cards.map((c,i)=>`<button class="mcard" data-i="${i}"><span class="back">🐾</span></button>`).join('')}</div>`;
  $$('.mcard',el).forEach(b=>b.onclick=()=>{
    const c=cards[+b.dataset.i];
    if(lock||b.classList.contains('up')||b.classList.contains('done')) return;
    sfx.click(); b.classList.add('up',c.kind); b.innerHTML=(c.kind==='term'?'🟣 ':'🟡 ')+c.t; open.push(b);
    if(open.length===2){
      moves++; $('#mv',el).textContent=moves;
      const [a,b2]=open, ca=cards[+a.dataset.i], cb=cards[+b2.dataset.i];
      if(ca.k===cb.k && ca.kind!==cb.kind){
        sfx.good(); a.classList.add('done'); b2.classList.add('done'); open=[]; matched++; $('#pr',el).textContent=matched;
        $('#mg',el).innerHTML=u.match(PAIRS[ca.k][0],PAIRS[ca.k][1]); $('#mg-dog',el).innerHTML=dog(80,'wow');
        if(matched===6) timers.push(setTimeout(finish,900));
      } else {
        lock=true; sfx.bad(); $('#mg-dog',el).innerHTML=dog(80,'sad'); $('#mg',el).innerHTML=u.noPair;
        timers.push(setTimeout(()=>{ [a,b2].forEach(x=>{ x.classList.remove('up','term','meaning'); x.innerHTML='<span class="back">🐾</span>'; }); open=[]; lock=false; },1100));
      }
    }
  });
  function finish(){
    const pass=moves<=16;
    gameResult(el,id,{pass,points:Math.max(40,200-moves*8),title:pass?u.mgWin(moves):u.mgLose(moves),detail:u.mgDetail});
  }
}
const GAMES = {lungs:gameLungs, skin:gameSkin, kidneys:gameKidney, liver:gameLiver};

/* ---------- Quiz engine (correct answer is always o[0] in the data; options are shuffled) ---------- */
function runQuiz(el, qs, opts){
  const u=T().ui; let i=0, correct=0, points=0, streak=0, best=0;
  const TT=15;
  function show(){
    const q=qs[i]; const choices=shuffle(q.o.map((t,k)=>({t,ok:k===0})));
    el.innerHTML = `<div class="qhead"><span class="pill">${u.question} ${i+1}/${qs.length}</span>${opts.timed?`<span class="pill">🔥 ${u.streak} ${streak}</span><span class="pill">⭐ ${points} ${u.pts}</span>`:`<span class="pill">✅ ${correct}</span>`}</div>
      ${opts.timed?'<div class="tbar"><div id="tf"></div></div>':''}
      ${guide(pick(opts.timed?u.thinkT:u.think),'happy',72,'qg')}
      <h3 class="qtext">${q.q}</h3>
      <div class="opts">${choices.map((c,k)=>`<button class="opt" data-k="${k}">${'ABCD'[k]}. ${c.t}</button>`).join('')}</div>
      <div id="qfb"></div>`;
    let done=false; const t0=Date.now();
    const answer=(k)=>{
      if(done) return; done=true; clearTimers();
      const left=Math.max(0,TT-(Date.now()-t0)/1000);
      const ok = k>=0 && choices[k].ok;
      $$('.opt',el).forEach((b,j)=>{ b.disabled=true; if(choices[j].ok) b.classList.add('right'); else if(j===k) b.classList.add('wrong'); });
      let gained=0;
      if(ok){ correct++; streak++; best=Math.max(best,streak); if(opts.timed){ gained=100+Math.round(left*5)+(streak>=3?50:0); points+=gained; } sfx.good(); }
      else { streak=0; sfx.bad(); }
      $('#qg-dog',el).innerHTML=dog(72,ok?'wow':'sad');
      $('#qg',el).innerHTML = ok ? pick(u.good)+(opts.timed?` +${gained} ${streak>=3?u.streakBonus:''}`:'') : (k<0?u.timeUp:pick(u.bad));
      $('#qfb',el).innerHTML = `<div class="fb ${ok?'ok':'no'}">💡 ${q.why}</div><div class="row"><button class="btn" id="qn">${i<qs.length-1?u.next:u.results}</button></div>`;
      $('#qn',el).onclick=()=>{ i++; if(i<qs.length) show(); else opts.onDone({correct,total:qs.length,points,best}); };
    };
    $$('.opt',el).forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    if(opts.timed){
      timers.push(setInterval(()=>{ const left=TT-(Date.now()-t0)/1000; const f=$('#tf',el); if(f) f.style.width=Math.max(0,left/TT*100)+'%'; if(left<=0) answer(-1); },100));
    }
  }
  show();
}

function quizPane(el,id){
  const o=O(id), u=T().ui;
  el.innerHTML = `${guide(u.quizIntro(o.name),'happy',80)}
    <div class="row" style="justify-content:center"><button class="btn pink" id="qs">${u.quizStart}</button></div>`;
  $('#qs',el).onclick=()=>runQuiz(el, shuffle(T().quiz[id]), {onDone:r=>{
    const st=S.organs[id], first=r.correct>=4 && (st.quizBest||0)<4;
    st.quizBest=Math.max(st.quizBest||0,r.correct); save();
    const pass=r.correct>=4; if(pass){ sfx.win(); confetti(first?90:40); } else sfx.bad();
    const nextOrgan = ORDER.find(k=>starsOf(k)<3 && k!==id);
    el.innerHTML = `${guide(pass?`${u.quizPass(r.correct,first)} ${starsOf(id)===3?u.quizMaster(o.name):''}`:u.quizFail(r.correct), pass?'wow':'sad',90)}
      <div class="result-big">${'⭐'.repeat(r.correct)}${'▫️'.repeat(5-r.correct)}</div>
      <div class="row" style="justify-content:center">
        <button class="btn ghost" id="qa">${u.tryQ}</button>
        ${starsOf(id)<3?`<button class="btn ghost" id="ql">${u.review}</button>`:''}
        ${nextOrgan?`<button class="btn green" id="qnext">${u.nextOrg(META[nextOrgan].emoji+' '+O(nextOrgan).name)}</button>`:`<button class="btn pink" id="qboss">${u.toBoss}</button>`}
        <button class="btn ghost" id="qm">${u.mapBtn}</button>
      </div>`;
    $('#qa',el).onclick=()=>go(screenOrgan,id,'quiz');
    if($('#ql',el)) $('#ql',el).onclick=()=>go(screenOrgan,id,'learn');
    if($('#qnext',el)) $('#qnext',el).onclick=()=>go(screenOrgan,nextOrgan,'learn');
    if($('#qboss',el)) $('#qboss',el).onclick=()=>go(screenShowdown);
    $('#qm',el).onclick=()=>go(screenMap);
  }});
}

/* ---------- Showdown ---------- */
function screenShowdown(){
  const u=T().ui;
  app.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><button class="btn ghost small" id="back">${u.map}</button><span class="pill">🏆 ${u.best}: ${S.showdown||0} ${u.pts}</span></div>
    <h2 style="margin-top:12px">🏆 ${u.bossT}</h2><div id="sd"></div></div>`;
  $('#back').onclick=()=>go(screenMap);
  const el=$('#sd');
  el.innerHTML = `${guide(u.sdIntro,'wow',90)}
    <div class="row" style="justify-content:center"><button class="btn pink" id="go">${u.sdGo}</button></div>`;
  $('#go').onclick=()=>{
    const pool = shuffle([...Object.values(T().quiz).flat(), ...T().extra]).slice(0,12);
    runQuiz(el,pool,{timed:true,onDone:r=>{ S.showdown=Math.max(S.showdown||0,r.points); save(); go(screenCert,r); }});
  };
}
function rank(p){ const R=T().ui.ranks; return p>=2000?[R[0],'🏆']:p>=1400?[R[1],'🥇']:p>=800?[R[2],'🥈']:[R[3],'🌱']; }
let certCelebrated=null;
function screenCert(r){
  const u=T().ui, [title,medal]=rank(r.points);
  const total=ORDER.reduce((a,k)=>a+starsOf(k),0);
  const date=new Date().toLocaleDateString(u.locale,{year:'numeric',month:'long',day:'numeric'});
  if(certCelebrated!==r){ certCelebrated=r; sfx.win(); confetti(120); }
  app.innerHTML = `<div class="card">
    <div class="cert">
      <div style="display:inline-block">${dog(110,'wow')}</div>
      <h1>${u.certT}</h1>
      <div class="muted" style="font-weight:700">${u.certs}</div>
      <div class="nm">${esc(S.name)}</div>
      <p style="font-size:1.1rem">${u.certDid}</p>
      <h2 style="font-size:1.8rem">${medal} ${title} ${medal}</h2>
      <div class="row" style="justify-content:center;margin:10px 0">
        <span class="pill">⭐ ${r.points} ${u.points}</span><span class="pill">✅ ${r.correct}/${r.total} ${u.correct}</span><span class="pill">🔥 ${u.bestStreak} ${r.best}</span><span class="pill">🌟 ${u.orgStars} ${total}/12</span>
      </div>
      <div style="font-size:2rem;letter-spacing:8px">🫁 🖐️ 🫘 🟤</div>
      <div class="muted" style="margin-top:8px">${date} · ${u.signed}</div>
    </div>
    <div class="row noprint" style="justify-content:center;margin-top:16px">
      <button class="btn" id="pr">${u.print}</button>
      <button class="btn ghost" id="again">${u.sdAgain}</button>
      <button class="btn ghost" id="map">${u.mapBtn}</button>
    </div>
    <p class="center muted noprint">${u.shot}</p>
  </div>`;
  $('#pr').onclick=()=>window.print();
  $('#again').onclick=()=>go(screenShowdown);
  $('#map').onclick=()=>go(screenMap);
}

/* ===================== Boot ===================== */
$('#brand').onclick=()=>go(S.name?screenMap:screenTitle);
$('#snd').onclick=()=>{ S.sound=!S.sound; save(); if(S.sound) sfx.click(); };
$('#lang').onclick=()=>{ if(current && current[0]===screenTitle){ const n=$('#nm'); if(n) S.name=n.value.trim()||S.name; } setLang(S.lang==='en'?'id':'en'); };
go(screenTitle);
</script>
</body>
</html>
